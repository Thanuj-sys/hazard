apiVersion: v1
kind: ConfigMap
metadata:
  name: multihazard-config
  labels:
    app: multihazard-vlm
data:
  API_BASE_URL: "http://multihazard-api:8000/api/v1"
  DB_CONNECTION: "postgresql://user:pass@db:5432/hazard"
  FALLBACK_OPTICAL: "landsat-9"
  FALLBACK_SAR: "nisar"
  FALLBACK_WEATHER: "imd-aws"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multihazard-api-deployment
  labels:
    app: multihazard-vlm
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multihazard-vlm
      component: api
  template:
    metadata:
      labels:
        app: multihazard-vlm
        component: api
    spec:
      containers:
      - name: api-container
        image: multihazard-vlm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: multihazard-config
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/dashboard/data
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: multihazard-api-service
  labels:
    app: multihazard-vlm
    component: api
spec:
  type: LoadBalancer # Can be changed to NodePort for on-prem bare-metal
  selector:
    app: multihazard-vlm
    component: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
