# Nginx configuration for MultiHazard-VLM API reverse proxy
# Place this in /etc/nginx/sites-available/ and enable with:
#   sudo ln -s /etc/nginx/sites-available/multihazard-vlm /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx

upstream multihazard_api {
    # Gunicorn worker processes
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s backup;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s backup;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=prediction_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP to HTTPS (optional)
    # return 301 https://$server_name$request_uri;

    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
    
    # Cache settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m;

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://multihazard_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Prediction endpoint (stricter rate limiting)
    location /api/v1/predict-point {
        limit_req zone=prediction_limit burst=5 nodelay;
        
        proxy_pass http://multihazard_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        
        # Cache GET requests
        proxy_cache api_cache;
        proxy_cache_key "$scheme$proxy_host$request_uri$request_body";
        proxy_cache_valid 200 1h;
        proxy_cache_methods GET HEAD POST;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Metrics endpoint (restrict access)
    location /metrics {
        proxy_pass http://multihazard_api;
        
        # Restrict to local network
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        deny all;
    }

    # Health check endpoint
    location /api/v1/health {
        proxy_pass http://multihazard_api;
        proxy_http_version 1.1;
        
        access_log off;
        proxy_set_header Connection "";
    }

    # API documentation
    location /docs {
        proxy_pass http://multihazard_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://multihazard_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Deny access to sensitive paths
    location ~ /\. {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Error pages
    error_page 502 503 504 /error.html;
    location = /error.html {
        internal;
    }

    # Root
    location / {
        return 404;
    }
}

# HTTPS configuration (optional)
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
